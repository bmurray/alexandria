# vX.Y.Z tags on main: full test (Go, web, e2e), multi-arch image tagged
# with the semver (X.Y.Z, X.Y, X), and the k3s manifests rendered against
# the X.Y.Z image pushed as a Flux OCI artifact tagged X.Y.Z. This is the
# ONLY path that publishes anything; ci.yml just proves builds. Flux
# (devops/flux/alexandria.yaml) selects the newest semver tag of the
# manifests artifact, so cutting a tag is the deploy.
# CHAD.md: releases only from main, always linux/amd64 and linux/arm64.
# No QEMU and no repository secrets beyond GITHUB_TOKEN.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

env:
  PKL_VERSION: "0.32.1"
  IMAGE: ghcr.io/${{ github.repository }}
  MANIFESTS: ghcr.io/${{ github.repository }}-manifests

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag must point at main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag ${GITHUB_REF_NAME} is not on main; refusing to release"
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: oven-sh/setup-bun@v2
      - uses: pkl-community/setup-pkl@v0
        with:
          pkl-version: ${{ env.PKL_VERSION }}

      # ---- full test: the same three suites ci.yml runs ----
      - name: Go
        run: |
          make gen-force
          git diff --exit-code -- internal/gen
          go vet -tags dev ./cmd/... ./internal/... ./config/... ./web
          go test -race -count=1 -tags dev ./cmd/... ./internal/... ./config/... ./web
      - name: Web
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run lint
          bun run typecheck
          bun run test
          bun run build
      - name: Build the real binary
        run: make build VERSION=${{ github.ref_name }}
      - name: Start the server
        run: |
          CONFIG_FILE=configs/e2e.pkl ./bin/alexandria > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:24380/api/readyz >/dev/null 2>&1; then
              echo "ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::server did not become ready"; cat server.log; exit 1
      - name: e2e
        run: |
          make e2e-install
          make e2e
      - name: Server log
        if: failure()
        run: cat server.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
      - name: Stop the server
        if: always()
        run: kill "$(cat server.pid)" 2>/dev/null || true

      # ---- image ----
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PKL_VERSION=${{ env.PKL_VERSION }}
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- Flux artifact ----
      - uses: fluxcd/flux2/action@main

      # The bare semver (no "v"): the image tag metadata-action produced,
      # and the artifact tag Flux's semver selector matches.
      - name: Render manifests against this release's image
        run: |
          export IMAGE_TAG="${GITHUB_REF_NAME#v}"
          make manifests
          grep -q "ghcr.io/bmurray/alexandria:${IMAGE_TAG}" deploy/out/k3s/manifests/alexandria.yaml \
            || { echo "::error::rendered manifests do not reference the ${IMAGE_TAG} image"; exit 1; }
          ! grep -q '^kind: ServiceAccount' deploy/out/k3s/manifests/alexandria.yaml
          ! grep -q '^kind: Secret$' deploy/out/k3s/manifests/alexandria.yaml

      - name: Push Flux OCI artifact
        run: |
          version="${GITHUB_REF_NAME#v}"
          flux push artifact "oci://${MANIFESTS}:${version}" \
            --path deploy/out/k3s/manifests \
            --source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --revision="${GITHUB_REF_NAME}@sha1:${GITHUB_SHA}"
